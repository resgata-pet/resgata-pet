# Ambiente de desenvolvimento local do Resgata WP. Não use em produção.
name: resgata-wp

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:-resgata}
  WORDPRESS_DB_USER: ${DB_USER:-resgata}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-resgata}
  WORDPRESS_DEBUG: 1
  # Chaves do SANDBOX da Stripe (módulo de apadrinhamento), vindas do .env.
  RWP_STRIPE_SECRET_KEY: ${STRIPE_SANDBOX_SECRET_KEY:-}
  RWP_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # Com STRIPE_KEYS_IN_PANEL=1 no .env, as chaves ficam fora do wp-config.php e são informadas pelo painel.
  RWP_STRIPE_KEYS_IN_PANEL: ${STRIPE_KEYS_IN_PANEL:-}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', true );
    define( 'SCRIPT_DEBUG', true );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    if ( ! getenv( 'RWP_STRIPE_KEYS_IN_PANEL' ) ) {
      define( 'RWP_STRIPE_SECRET_KEY', (string) getenv( 'RWP_STRIPE_SECRET_KEY' ) );
      define( 'RWP_STRIPE_WEBHOOK_SECRET', (string) getenv( 'RWP_STRIPE_WEBHOOK_SECRET' ) );
    }

x-wp-volumes: &wp-volumes
  - wp_data:/var/www/html
  - ./plugins/resgata-wp:/var/www/html/wp-content/plugins/resgata-wp
  - ./themes/resgata-tema:/var/www/html/wp-content/themes/resgata-tema
  - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-resgata}
      MARIADB_USER: ${DB_USER:-resgata}
      MARIADB_PASSWORD: ${DB_PASSWORD:-resgata}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:7.1-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes: *wp-volumes

  wpcli:
    image: wordpress:cli-2.12-php8.2
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment: *wp-env
    volumes: *wp-volumes

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # Stripe CLI: recebe os eventos do sandbox e repassa ao webhook do site local (`make stripe`).
  stripe:
    image: stripe/stripe-cli:v1.53.0
    profiles: ["stripe"]
    depends_on:
      wordpress:
        condition: service_started
    environment:
      STRIPE_API_KEY: ${STRIPE_SANDBOX_SECRET_KEY:-}
      STRIPE_DEVICE_NAME: resgata-wp-local
    command:
      - listen
      - --forward-to
      - http://wordpress/wp-json/resgata-wp/v1/stripe/webhook
      - --events
      - checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed,invoice_payment.paid,charge.refunded,charge.dispute.created,charge.dispute.updated,charge.dispute.closed,customer.updated

volumes:
  db_data:
  wp_data:
