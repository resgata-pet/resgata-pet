# Ambiente de desenvolvimento local do Resgata WP. Não use em produção.
name: resgata-wp

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:-resgata}
  WORDPRESS_DB_USER: ${DB_USER:-resgata}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-resgata}
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', true );
    define( 'SCRIPT_DEBUG', true );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );

x-wp-volumes: &wp-volumes
  - wp_data:/var/www/html
  - ./plugins/resgata-wp:/var/www/html/wp-content/plugins/resgata-wp
  - ./themes/resgata-tema:/var/www/html/wp-content/themes/resgata-tema
  - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-resgata}
      MARIADB_USER: ${DB_USER:-resgata}
      MARIADB_PASSWORD: ${DB_PASSWORD:-resgata}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes: *wp-volumes

  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment: *wp-env
    volumes: *wp-volumes

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  wp_data:
