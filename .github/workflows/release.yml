# Publica uma versão: ao enviar uma tag (ex.: 0.5.0), gera os pacotes, cria a release no
# GitHub com os dois .zip e, se o plugin já estiver no WordPress.org, envia a versão para lá.
#
# O envio ao WordPress.org só roda com a variável WPORG_SLUG definida no repositório
# (Settings → Secrets and variables → Actions → Variables) e usa os segredos SVN_USERNAME e
# SVN_PASSWORD (a senha de SVN do perfil no WordPress.org, não a de login).
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Pacotes e publicação
    runs-on: ubuntu-latest
    env:
      PLUGIN: plugins/resgata-wp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Confere a versão
        env:
          TAG: ${{ github.ref_name }}
        run: |
          header="$(sed -n 's/^ \* Version: *//p' "$PLUGIN/resgata-wp.php")"
          constant="$(sed -n "s/^define( 'RESGATA_VERSION', '\(.*\)' );/\1/p" "$PLUGIN/resgata-wp.php")"
          stable="$(sed -n 's/^Stable tag: *//p' "$PLUGIN/readme.txt")"
          for value in "$header" "$constant" "$stable"; do
            if [ "$value" != "$TAG" ]; then
              echo "::error::A tag $TAG não bate com o plugin (Version: $header, RESGATA_VERSION: $constant, Stable tag: $stable)."
              exit 1
            fi
          done

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/resgata-wp/package-lock.json

      - name: Gera os pacotes
        run: make zip

      - name: Cria a release no GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/resgata-wp.zip
            dist/resgata-tema.zip

      # O WordPress.org recebe exatamente o conteúdo do pacote do plugin.
      - name: Prepara o envio ao WordPress.org
        if: vars.WPORG_SLUG != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion
          unzip -q dist/resgata-wp.zip -d dist/wporg

      - name: Envia ao WordPress.org
        if: vars.WPORG_SLUG != ''
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: ${{ vars.WPORG_SLUG }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          BUILD_DIR: dist/wporg/resgata-wp
          ASSETS_DIR: plugins/resgata-wp/.wordpress-org
